<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador de Venta</title>
  </head>
  <body>
    <h1>Totalizador de Venta</h1>
    <form id="venta-form">
      <label for="cantidad-input">Cantidad:</label>
      <input type="number" id="cantidad-input" />
      <label for="precio-input">Precio:</label>
      <input type="number" id="precio-input" />
      <label for="estado-select">Estado:</label>
      <select id="estado-select"></select>
      <label for="categoria-select">Categoria:</label>
      <select id="categoria-select"></select>
      <label for="tipo-cliente-select">Tipo de cliente:</label>
      <select id="tipo-cliente-select"></select>
      <label for="peso-input">Peso volumetrico por unidad:</label>
      <input type="number" id="peso-input" />
      <input type="submit" value="Calcular" id="calcular-button" />
      <button type="button" id="confirmar-button">Confirmar</button>
      <button type="button" id="cancelar-button">Cancelar</button>
    </form>
    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
